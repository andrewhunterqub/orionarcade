<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orion Arcade</title>
  <meta name="description" content="Orion Arcade: free, fun games you can play in your browser.">
  <meta property="og:title" content="Orion Arcade">
  <meta property="og:description" content="Free, fun games you can play in your browser.">
  <meta name="theme-color" content="#0b1026">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./">
      <img src="assets/favicon.svg" alt="" width="36" height="36">
      <span>Orion <strong>Arcade</strong></span>
    </a>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Free, fun games.</h1>
      <p>No downloads, no sign-ups. Pick a game and play right in your browser.</p>
    </section>

    <section class="toolbar" aria-label="Filter games">
      <input id="search" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
      <div id="tags" class="tags" role="group" aria-label="Filter by tag"></div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> Orion Design</span>
  </footer>

  <script src="assets/library.js" type="module"></script>
</body>
</html>
